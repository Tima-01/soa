<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Task Form</title>
</head>
<body>
<h1>Task Form</h1>

<form th:action="@{/task/save}" th:object="${task}" method="post">

  <div>
    <label>Name:</label>
    <input type="text" th:field="*{name}" placeholder="Name" />
    <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color:red;"></div>
  </div>

  <div>
    <label>Description:</label>
    <textarea th:field="*{description}" placeholder="Description"></textarea>
    <div th:if="${#fields.hasErrors('description')}" th:errors="*{description}" style="color:red;"></div>
  </div>

  <div>
    <label>Due Date:</label>
    <input type="date" th:field="*{dueDate}" />
    <div th:if="${#fields.hasErrors('dueDate')}" th:errors="*{dueDate}" style="color:red;"></div>
  </div>

  <div>
    <label>Completed:</label>
    <input type="checkbox" th:field="*{completed}" />
  </div>

  <button type="submit">Save</button>
</form>

<a th:href="@{/task}">Back to list</a>
</body>
</html>
